name: Release

# A dtfit-v* tag publishes to PyPI; a manual run publishes to TestPyPI. Both use
# trusted publishing (OIDC), so no API token is stored. Only dtfit is published.
on:
  push:
    tags: ["dtfit-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build packages/dtfit --outdir dist
      # The tag dtfit-vX.Y.Z must name the version the wheel was built with.
      - name: Check the tag against the package version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          PKG=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('packages/dtfit/src/dtfit/__about__.py').read()).group(1))")
          if [ "${GITHUB_REF_NAME}" != "dtfit-v${PKG}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match dtfit ${PKG}" >&2
            exit 1
          fi
      - run: python -m pip install twine && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
